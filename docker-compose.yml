services:
  data-nest:
    build: .
    image: data-nest:latest
    container_name: data-nest
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "3000"
      # 仅首次启动（空数据库）时生效，请按需修改
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      # 生产环境务必改为随机长字符串
      JWT_SECRET: change-me-to-a-random-string
    restart: unless-stopped
